# kidlock admin configuration (~/.config/kidlock/kidlock.conf)
# Simple KEY=VALUE file. Read by `kidlock` (bash) and generate_lua.py.
# After changing BLOCK_* flags, run:  kidlock apply-config && hyprctl reload

# Master switch. "false" = boot never locks, `kidlock lock` still works manually.
KIDLOCK_ENABLED="true"

# State applied at login by the systemd user unit (kidlock.service -> `kidlock boot`).
# LOCKED | UNLOCKED
KIDLOCK_INITIAL_STATE="UNLOCKED"

# Session ownership. Empty = whichever user runs `kidlock` owns the lock.
# Set to the student username to make `kidlock` refuse for anyone else, e.g.:
# KIDLOCK_USER="student"
KIDLOCK_USER=""

# --- Behaviour flags (regenerate lua after changing) -----------------------
# Bare Escape swallowed while locked. (Ctrl/Alt/Super+Esc always swallowed.)
BLOCK_ESC="true"
# Bare Tab and Shift+Tab swallowed while locked.
BLOCK_TAB="true"
# Bare arrows AND Shift+arrows swallowed (mouse text selection still works).
BLOCK_ARROWS="true"
# Bare Home/End/PageUp/PageDown/Insert swallowed.
BLOCK_NAV="true"
# Bare F1-F12 swallowed.
BLOCK_FKEYS="true"
# Bare Print/Pause/ScrollLock/Menu and lone Super keys swallowed.
BLOCK_SYS="true"
